name: Bedrock Add-on Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bedrock-addon-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-addon:
    name: Validate and package Bedrock add-on
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Minecraft Bedrock beta Script API typings
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run validator unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate complete add-on
        run: python tools/validate_addon.py --report artifacts/addon-validation.json

      - name: Validate Bedrock resource identifier links
        run: python tools/validate_resource_links.py --report artifacts/resource-link-validation.json

      - name: Validate all Bedrock structures
        run: python tools/validate_mcstructures.py --report artifacts/mcstructure-validation.json

      - name: Check all behavior-pack JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find TheBrokenScript_Bedrock_2_0/BP/scripts -type f -name '*.js' -print0)
          if (( ${#scripts[@]} == 0 )); then
            echo 'No runtime JavaScript files found.' >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "Checking $script"
            node --check "$script"
          done

      - name: Type-check behavior scripts against Bedrock beta APIs
        run: npm run typecheck

      - name: Run JavaScript regression tests
        run: npm test

      - name: Checkout Blockception Bedrock language server
        uses: actions/checkout@v5
        with:
          repository: Blockception/minecraft-bedrock-language-server
          path: .blockception/minecraft-bedrock-language-server
          submodules: recursive

      - name: Build Blockception Bedrock language server
        shell: bash
        run: |
          set -euo pipefail
          cd .blockception/minecraft-bedrock-language-server
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          echo "BLOCKCEPTION_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run Blockception project diagnostics
        run: >-
          node tools/run_blockception_lsp_check.mjs
          --server .blockception/minecraft-bedrock-language-server/ide/vscode/lsp/server.js
          --workspace TheBrokenScript_Bedrock_2_0
          --report artifacts/blockception-lsp-diagnostics.json

      - name: Stage production packs for Mojang Creator Tools
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/mct
          mkdir -p .ci/mct/behavior_packs/bp
          mkdir -p .ci/mct/resource_packs/rp
          cp -a TheBrokenScript_Bedrock_2_0/BP/. .ci/mct/behavior_packs/bp/
          cp -a TheBrokenScript_Bedrock_2_0/RP/. .ci/mct/resource_packs/rp/

          find .ci/mct -type f \( -name '*.gif' -o -name '*.json.old' \) -delete
          if [[ -f .ci/mct/resource_packs/rp/sound_definitions.json ]]; then
            mkdir -p .ci/mct/resource_packs/rp/sounds
            mv .ci/mct/resource_packs/rp/sound_definitions.json .ci/mct/resource_packs/rp/sounds/sound_definitions.json
          fi

          node --input-type=module <<'NODE'
          import { readFile, readdir, writeFile } from 'node:fs/promises';
          import path from 'node:path';

          async function walk(dir) {
            for (const entry of await readdir(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                await walk(full);
              } else if (entry.isFile() && entry.name.toLowerCase().endsWith('.json')) {
                const bytes = await readFile(full);
                if (bytes.length >= 3 && bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf) {
                  await writeFile(full, bytes.subarray(3));
                }
              }
            }
          }

          await walk('.ci/mct');
          NODE

      - name: Validate production packs with Mojang Minecraft Creator Tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          npm exec --yes --package=@minecraft/creator-tools@0.17.7 -- \
            mct validate main -i .ci/mct --json > .ci/mct-validation.json
          MCT_STATUS=$?
          set -e
          cp .ci/mct-validation.json artifacts/mct-validation.json
          export MCT_STATUS

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const report = JSON.parse(readFileSync('.ci/mct-validation.json', 'utf8'));
          if (!Array.isArray(report.projects) || report.projects.length === 0) {
            throw new Error('Mojang Creator Tools did not discover any Minecraft projects.');
          }

          const items = report.projects.flatMap((project) =>
            (project.items ?? []).map((item) => ({ project: project.name, ...item })),
          );
          const blockingTypes = new Set(['error', 'testFail', 'internalProcessingError']);
          const rawBlockers = items.filter((item) => blockingTypes.has(item.type));
          const warnings = items.filter((item) => item.type === 'warning');

          function serializedFinding(item) {
            return JSON.stringify(item);
          }

          function isSelfComparisonScriptModuleError(item) {
            if (item.type !== 'error') return false;
            const text = serializedFinding(item);
            if (!text.includes('@minecraft/server') || !text.includes('using an out of date beta version')) return false;
            const versions = [...text.matchAll(/\d+\.\d+\.\d+-beta\.[0-9A-Za-z.-]+/g)].map((match) => match[0]);
            return versions.length >= 2 && versions.at(-2) === versions.at(-1);
          }

          const scriptModuleErrors = rawBlockers.filter(
            (item) => item.type === 'error' && serializedFinding(item).includes('using an out of date beta version'),
          );
          const onlySelfComparisonScriptErrors = scriptModuleErrors.length > 0
            && scriptModuleErrors.every(isSelfComparisonScriptModuleError);

          const blockers = rawBlockers.filter((item) => {
            if (isSelfComparisonScriptModuleError(item)) return false;
            const text = serializedFinding(item);
            if (
              item.type === 'testFail'
              && text.includes('Script Modules check')
              && onlySelfComparisonScriptErrors
            ) return false;
            return true;
          });
          const ignored = rawBlockers.length - blockers.length;

          console.log(`Mojang Creator Tools: ${report.projects.length} project(s), ${blockers.length} blocker(s), ${warnings.length} warning(s), ${ignored} known false-positive blocker(s) ignored.`);
          for (const item of blockers) {
            const itemPath = item.path ? ` (${item.path})` : '';
            const data = item.data === undefined ? '' : `: ${typeof item.data === 'string' ? item.data : JSON.stringify(item.data)}`;
            console.error(`[${item.type}] ${item.generatorId ?? 'validation'}: ${item.message}${data}${itemPath}`);
          }
          if (ignored > 0) {
            console.warn('Ignored Mojang Creator Tools Script Module self-comparison findings where the reported out-of-date beta version exactly equals the reported current version.');
          }

          const status = Number(process.env.MCT_STATUS ?? '0');
          if (blockers.length > 0 || (status !== 0 && ignored === 0)) {
            throw new Error(`Mojang Creator Tools validation failed (exit ${status}) with ${blockers.length} blocking finding(s).`);
          }
          NODE

      - name: Package successful build as .mcaddon
        id: package_addon
        continue-on-error: true
        shell: bash
        run: bash tools/package-addon.sh

      - name: Upload The Broken Script 2.0 .mcaddon
        id: upload_addon
        if: steps.package_addon.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: The_Broken_Script_2_0-mcaddon
          path: dist/The_Broken_Script_2_0.mcaddon
          if-no-files-found: error
          retention-days: 30

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: addon-validation-reports
          path: artifacts/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail on packaging or upload errors
        if: ${{ steps.package_addon.outcome == 'failure' || steps.upload_addon.outcome == 'failure' }}
        run: exit 1
