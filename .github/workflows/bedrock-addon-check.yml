name: Bedrock Add-on Check

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      enforce_parity:
        description: "Require fully reconciled parity ledgers"
        required: false
        default: false
        type: boolean
      enforce_runtime_smoke:
        description: "Require a complete Bedrock runtime smoke report"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: bedrock-addon-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-addon:
    name: Validate and package Bedrock add-on
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Minecraft Bedrock beta Script API typings (pinned)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate runtime smoke-test matrix
        if: always()
        run: python tools/validate_runtime_smoke_matrix.py tests/runtime-smoke/matrix.json

      # Keep the static suite running even if one validator fails so every CI run
      # reports the complete set of actionable failures instead of stopping early.
      - name: Run validator unit tests
        if: always()
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate P2 Script API and version contract
        if: always()
        run: python tools/validate_p2_contract.py --check --report artifacts/p2-contract-validation.json

      - name: Audit P2 Java and Bedrock randomness provenance
        if: always()
        run: >-
          python tools/audit_randomness.py
          --check
          --report artifacts/randomness-audit.json
          --markdown artifacts/randomness-audit.md

      - name: Run P2 deterministic parity and cache regressions
        if: always()
        run: >-
          node --experimental-vm-modules --test
          tests/horror_event_model.test.mjs
          tests/random_determinism.test.mjs
          tests/perf_model.test.mjs
          tests/p2_source_snapshot.test.mjs
          tests/p2_profile.test.mjs

      - name: Profile P2 1-tick scan workload
        if: always()
        run: node tools/profile_p2_scans.mjs --check

      - name: Validate selected P1 content and dimension parity
        if: always()
        run: python tools/validate_p1_parity.py --check --report artifacts/p1-parity-validation.json

      - name: Validate persistent state parity
        if: always()
        run: python tools/validate_persistent_state.py --report artifacts/persistent-state-validation.json

      - name: Run full source-to-runtime audit
        if: always()
        run: >-
          python tools/audit_source_to_runtime.py
          --check
          --report artifacts/source-to-runtime-audit.json

      - name: Reconcile parity ledger against shipped tree
        if: always()
        run: python tools/reconcile_parity_ledgers.py --check

      - name: Validate strict parity ledgers
        if: ${{ always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || inputs.enforce_parity || startsWith(github.ref, 'refs/tags/v')) }}
        run: python tools/validate_parity_ledgers.py

      - name: Validate complete add-on
        if: always()
        run: python tools/validate_addon.py --report artifacts/addon-validation.json

      - name: Validate Bedrock resource identifier links
        if: always()
        run: python tools/validate_resource_links.py --report artifacts/resource-link-validation.json

      - name: Validate presentation and player-visible timing
        if: always()
        run: python tools/validate_presentation.py --report artifacts/presentation-validation.json

      - name: Validate Jigsaw worldgen definitions
        if: always()
        run: python tools/validate_jigsaw_worldgen.py

      - name: Validate Jigsaw NBT connector graph
        if: always()
        run: python tools/validate_jigsaw_nbt_connectors.py

      - name: Validate all Bedrock structures
        if: always()
        run: python tools/validate_mcstructures.py --report artifacts/mcstructure-validation.json

      - name: Check all behavior-pack JavaScript syntax
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find TheBrokenScript_Bedrock_2_0/BP/scripts -type f -name '*.js' -print0)
          if (( ${#scripts[@]} == 0 )); then
            echo 'No runtime JavaScript files found.' >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "Checking $script"
            node --check "$script"
          done

      - name: Type-check behavior scripts against Bedrock beta APIs
        if: always()
        run: npm run typecheck

      - name: Run JavaScript regression tests
        if: always()
        run: npm test

      - name: Run entity-family fidelity regressions
        if: always()
        run: node --test tests/entity_family_fidelity.test.mjs

      - name: Run story clock and day-cycle parity regressions
        if: always()
        run: node --experimental-vm-modules --test tests/story_clock.test.mjs

      - name: Run Integrity boss parity regressions
        if: always()
        run: >-
          node --experimental-vm-modules --test
          tests/integrity_parity_model.test.mjs
          tests/integrity_arena_runtime.test.mjs
          tests/integrity_arena_model.test.mjs
          tests/phase3_attack_model.test.mjs
          tests/phase3_lifecycle_model.test.mjs

      - name: Checkout Blockception Bedrock language server
        if: always()
        uses: actions/checkout@v5
        with:
          repository: Blockception/minecraft-bedrock-language-server
          path: .blockception/minecraft-bedrock-language-server
          submodules: recursive

      - name: Build Blockception Bedrock language server
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd .blockception/minecraft-bedrock-language-server
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          echo "BLOCKCEPTION_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run Blockception project diagnostics
        if: always()
        run: >-
          node tools/run_blockception_lsp_check.mjs
          --server .blockception/minecraft-bedrock-language-server/ide/vscode/lsp/server.js
          --workspace TheBrokenScript_Bedrock_2_0
          --report artifacts/blockception-lsp-diagnostics.json

      - name: Stage production packs for Mojang Creator Tools
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/mct
          mkdir -p .ci/mct/behavior_packs/bp
          mkdir -p .ci/mct/resource_packs/rp
          cp -a TheBrokenScript_Bedrock_2_0/BP/. .ci/mct/behavior_packs/bp/
          cp -a TheBrokenScript_Bedrock_2_0/RP/. .ci/mct/resource_packs/rp/

          # Current Bedrock Jigsaw supports structure templates stored as .nbt or
          # .mcstructure. Keep the source-identical Shaft .nbt files in the exact
          # production stage that MCT inspects; our dedicated Jigsaw validators run
          # above before the narrowly scoped MCT compatibility filter is applied.
          find .ci/mct -type f \( -name '*.gif' -o -name '*.json.old' \) -delete
          if [[ -f .ci/mct/resource_packs/rp/sound_definitions.json ]]; then
            mkdir -p .ci/mct/resource_packs/rp/sounds
            mv .ci/mct/resource_packs/rp/sound_definitions.json .ci/mct/resource_packs/rp/sounds/sound_definitions.json
          fi

          node --input-type=module <<'NODE'
          import { readFile, readdir, writeFile } from 'node:fs/promises';
          import path from 'node:path';

          async function walk(dir) {
            for (const entry of await readdir(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                await walk(full);
              } else if (entry.isFile() && entry.name.toLowerCase().endsWith('.json')) {
                const bytes = await readFile(full);
                if (bytes.length >= 3 && bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf) {
                  await writeFile(full, bytes.subarray(3));
                }
              }
            }
          }

          await walk('.ci/mct');
          NODE

      - name: Validate production packs with Mojang Minecraft Creator Tools
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          npm exec --yes --package=@minecraft/creator-tools@0.17.7 -- \
            mct validate main -i .ci/mct --json > .ci/mct-validation.json
          MCT_STATUS=$?
          set -e
          cp .ci/mct-validation.json artifacts/mct-validation.json
          export MCT_STATUS

          node tools/filter_mct_validation.mjs .ci/mct-validation.json

      - name: Package successful build as .mcaddon
        id: package_addon
        if: success()
        shell: bash
        env:
          STRICT_PARITY: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || inputs.enforce_parity || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          if [[ "$STRICT_PARITY" == "true" ]]; then
            bash tools/package-addon.sh --release
          else
            bash tools/package-addon.sh
          fi

          CANDIDATE_COMMIT="$(git rev-parse --verify HEAD^{commit})"
          ARTIFACT_SHA256="$(sha256sum dist/The_Broken_Script_2_0.mcaddon | awk '{print $1}')"
          if [[ ! "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The checked-out candidate commit is not a full 40-hex SHA: $CANDIDATE_COMMIT" >&2
            exit 1
          fi
          if [[ ! "$ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The packaged .mcaddon digest is not a full 64-hex SHA-256: $ARTIFACT_SHA256" >&2
            exit 1
          fi
          echo "candidate_commit=$CANDIDATE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$ARTIFACT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Validate runtime smoke report against packaged candidate when present
        if: ${{ always() && hashFiles('tests/runtime-smoke/latest-report.json') != '' }}
        shell: bash
        run: >-
          python tools/validate_runtime_smoke_report.py
          tests/runtime-smoke/latest-report.json
          --matrix tests/runtime-smoke/matrix.json
          --artifact dist/The_Broken_Script_2_0.mcaddon
          --expected-commit "${{ steps.package_addon.outputs.candidate_commit }}"
          --expected-artifact-sha256 "${{ steps.package_addon.outputs.artifact_sha256 }}"

      # A green main branch must mean the repository has current real-engine
      # evidence, not merely that static validators passed. Pull requests can still
      # run the static suite while the smoke report is being produced separately.
      - name: Enforce complete runtime smoke evidence on main and releases
        if: ${{ always() && (github.ref == 'refs/heads/main' || inputs.enforce_runtime_smoke || startsWith(github.ref, 'refs/tags/v')) }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f tests/runtime-smoke/latest-report.json ]]; then
            echo 'Missing tests/runtime-smoke/latest-report.json.' >&2
            echo 'A green main/release build requires a complete real Bedrock runtime smoke report.' >&2
            exit 1
          fi
          python tools/validate_runtime_smoke_report.py \
            tests/runtime-smoke/latest-report.json \
            --matrix tests/runtime-smoke/matrix.json \
            --artifact dist/The_Broken_Script_2_0.mcaddon \
            --expected-commit "${{ steps.package_addon.outputs.candidate_commit }}" \
            --expected-artifact-sha256 "${{ steps.package_addon.outputs.artifact_sha256 }}" \
            --require-complete

      - name: Upload The Broken Script 2.0 .mcaddon
        id: upload_addon
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: The_Broken_Script_2_0-mcaddon
          path: dist/The_Broken_Script_2_0.mcaddon
          if-no-files-found: error
          retention-days: 30

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: addon-validation-reports
          path: artifacts/*.json
          if-no-files-found: ignore
          retention-days: 30
